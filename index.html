<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE CORRIDOR</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
    user-select:none;
}

canvas {
    display:block;
    width:100vw;
    height:100vh;
    image-rendering:pixelated;
}

#menu {
    position:fixed;
    inset:0;
    z-index:10;
    background:#030303;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

h1 {
    font-size:clamp(35px,7vw,65px);
    letter-spacing:10px;
    color:#ddd;
    text-shadow:0 0 20px #700;
}

p {
    color:#888;
    margin-top:20px;
}

button {
    background:#250000;
    color:white;
    border:1px solid #800;
    padding:16px 45px;
    margin-top:35px;
    font-size:18px;
    cursor:pointer;
    transition:background 0.2s;
}

button:hover { background:#600; }

#black {
    position:fixed;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    z-index:5;
    transition:opacity 0.8s;
}

#help {
    position:fixed;
    bottom:15px;
    left:15px;
    color:#aaa;
    font-size:12px;
    z-index:4;
    line-height:1.7;
    text-shadow:0 0 5px black;
}

#crosshair {
    position:fixed;
    top:50%;
    left:50%;
    color:rgba(255,255,255,0.6);
    transform:translate(-50%,-50%);
    z-index:3;
    display:none;
    pointer-events:none;
    font-size:20px;
}

#prompt {
    position:fixed;
    top:65%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:14px;
    background:rgba(0,0,0,0.7);
    padding:8px 16px;
    border:1px solid #555;
    z-index:4;
    display:none;
    pointer-events:none;
    letter-spacing:1px;
}

#loop-counter {
    position:fixed;
    top:15px;
    right:15px;
    color:rgba(255,255,255,0.3);
    font-size:12px;
    z-index:4;
    letter-spacing:2px;
}

/* Message UI système temporaire (3 secondes) */
#game-message {
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255, 255, 255, 0.85);
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    z-index:4;
    display:none;
    opacity:0;
    pointer-events:none;
    text-align:center;
    background:rgba(0, 0, 0, 0.4);
    padding:6px 14px;
    border-radius:3px;
    border:1px solid rgba(255, 255, 255, 0.15);
    transition:opacity 0.5s ease;
}
</style>
</head>

<body>

<div id="menu">
    <h1>THE CORRIDOR</h1>
    <p>Tu es seul...</p>
    <button id="enter">ENTRER</button>
</div>

<div id="black"></div>
<div id="help"></div>
<div id="crosshair">+</div>
<div id="prompt">APPUIE SUR [E] OU CLIQUE POUR OUVRIR</div>
<div id="loop-counter">PORTES OUVERTES : <span id="loop-num">0</span></div>
<div id="game-message">Arrête d'ouvrir les portes</div>

<canvas id="game"></canvas>

<script>
"use strict";

// =================================
// INITIALISATION & AUDIO PROCEDURAL
// =================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 640;
canvas.height = 360;

const menu = document.getElementById("menu");
const black = document.getElementById("black");
const help = document.getElementById("help");
const crosshair = document.getElementById("crosshair");
const promptEl = document.getElementById("prompt");
const loopNumEl = document.getElementById("loop-num");
const gameMsgEl = document.getElementById("game-message");

let playing = false;
let second = false;
let monster = 0;
let scare = false;
let scareTime = 0;
let doorsOpened = 0;
let messageShown = false;

let playerX = 0;
let playerZ = 2;
let yaw = 0;

let keys = {};
let lastTime = 0;
let stepTimer = 0;
let activeDoor = null;

// Taches de sang fixes générées
let bloodStains = [];

let doors = [
    { id: 0, side: 1,  x: 2.48,  z: -9,  openProgress: 0, opening: false },
    { id: 1, side: 1,  x: 2.48,  z: -21, openProgress: 0, opening: false },
    { id: 2, side: -1, x: -2.48, z: -15, openProgress: 0, opening: false }
];

let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function generateBloodStains() {
    bloodStains = [];
    for(let i = 0; i < 40; i++) {
        bloodStains.push({
            x: (Math.random() - 0.5) * 4.8,
            y: Math.random() * 2.8,
            z: -Math.random() * 38,
            radius: 0.3 + Math.random() * 0.8,
            surface: Math.floor(Math.random() * 3), // 0: sol, 1: mur gauche, 2: mur droit
            drip: Math.random() * 0.5
        });
    }
}

function playSound(type) {
    if (!audioCtx) return;
    
    if (type === "step") {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(60 + Math.random() * 20, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === "door") {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }
}

// =================================
// CLAVIER & INTERACTIONS
// =================================

document.addEventListener("keydown", e => {
    let key = e.key.toLowerCase();
    keys[key] = true;

    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key)) {
        e.preventDefault();
    }

    if(key === "e" && playing && second && activeDoor !== null) {
        openDoor(activeDoor);
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

// =================================
// LANCEMENT & REINITIALISATION
// =================================

document.getElementById("enter").addEventListener("click", () => {
    initAudio();
    start();
});

function start() {
    playing = true;
    scare = false;
    scareTime = 0;
    monster = 0;
    messageShown = false;

    playerX = 0;
    playerZ = 2;
    yaw = 0;
    keys = {};

    resetDoors();
    generateBloodStains();

    black.style.opacity = "0";
    menu.style.display = "none";
    gameMsgEl.style.display = "none";
    gameMsgEl.style.opacity = "0";

    if(second) {
        help.innerHTML = "ZQSD / WASD : BOUGER<br>FLÈCHES / SOURIS : REGARDER<br>[E] OU CLIC : OUVRIR PORTES";
        crosshair.style.display = "block";
    } else {
        help.innerHTML = "";
        crosshair.style.display = "none";
    }
}

function resetDoors() {
    doors.forEach(d => {
        d.openProgress = 0;
        d.opening = false;
    });
}

function showTemporaryMessage() {
    gameMsgEl.style.display = "block";
    setTimeout(() => {
        gameMsgEl.style.opacity = "1";
    }, 10);

    // Masque le message au bout de 3 secondes
    setTimeout(() => {
        gameMsgEl.style.opacity = "0";
        setTimeout(() => {
            gameMsgEl.style.display = "none";
        }, 500);
    }, 3000);
}

function openDoor(doorIndex) {
    if (doors[doorIndex].opening) return;
    
    doors[doorIndex].opening = true;
    playSound("door");
    
    setTimeout(() => {
        black.style.opacity = "1";
        setTimeout(() => {
            doorsOpened++;
            loopNumEl.innerText = doorsOpened;
            
            // Re-téléportation au début du couloir
            playerX = 0;
            playerZ = 2;
            yaw = 0;
            resetDoors();
            
            // Afficher le message de 3 secondes à la 10ème porte
            if (doorsOpened >= 10 && !messageShown) {
                messageShown = true;
                showTemporaryMessage();
            }
            
            black.style.opacity = "0";
        }, 800);
    }, 400);
}

// =================================
// PROJECTION 3D
// =================================

function project(x,y,z) {
    let dx = x-playerX;
    let dz = z-playerZ;

    let cos = Math.cos(yaw);
    let sin = Math.sin(yaw);

    let rx = dx*cos + dz*sin;
    let depth = dx*sin - dz*cos;

    if(depth < 0.15) return null;

    const focal = 300;

    return {
        x:320 + rx*focal/depth,
        y:180 + (1.55-y)*focal/depth,
        scale:focal/depth,
        depth:depth
    };
}

function polygon(points,color) {
    let projected = points.map(p => project(p[0],p[1],p[2]));
    if(projected.some(p => !p)) return;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(projected[0].x,projected[0].y);

    for(let i=1;i<projected.length;i++) {
        ctx.lineTo(projected[i].x,projected[i].y);
    }

    ctx.closePath();
    ctx.fill();
}

// =================================
// DESSIN DU SANG (PROGRESSION SUR 10 PORTES)
// =================================

function drawBloodOverlay() {
    if (doorsOpened < 2) return;

    let bloodIntensity = Math.min(1, (doorsOpened - 1) / 9);

    let visibleStainsCount = Math.floor(bloodStains.length * bloodIntensity);
    for (let i = 0; i < visibleStainsCount; i++) {
        let b = bloodStains[i];
        let p = project(b.surface === 1 ? -2.47 : (b.surface === 2 ? 2.47 : b.x), b.surface === 0 ? 0.01 : b.y, b.z);
        if (p) {
            let r = b.radius * p.scale;
            ctx.fillStyle = `rgba(130, 0, 0, ${0.4 + bloodIntensity * 0.5})`;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, r, r * (b.surface === 0 ? 0.3 : 1), 0, 0, Math.PI * 2);
            ctx.fill();

            if (b.surface !== 0) {
                ctx.fillRect(p.x - r * 0.2, p.y, r * 0.4, r * (1 + b.drip * 2));
            }
        }
    }

    if (bloodIntensity > 0.3) {
        ctx.fillStyle = `rgba(120, 0, 0, ${(bloodIntensity - 0.3) * 0.4})`;
        ctx.fillRect(0, 0, 640, 360);
    }

    if (doorsOpened >= 10) {
        let vignette = ctx.createRadialGradient(320, 180, 50, 320, 180, 300);
        vignette.addColorStop(0, "transparent");
        vignette.addColorStop(0.7, "rgba(80, 0, 0, 0.8)");
        vignette.addColorStop(1, "rgba(150, 0, 0, 0.98)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, 640, 360);
    }
}

// =================================
// COULOIR & RENDU
// =================================

function corridor() {
    ctx.fillStyle = "#030303";
    ctx.fillRect(0,0,640,360);

    let glow = ctx.createRadialGradient(320,130,2,320,130,190);
    glow.addColorStop(0,"#777");
    glow.addColorStop(0.25,"#393939");
    glow.addColorStop(1,"#000");

    ctx.fillStyle = glow;
    ctx.fillRect(100,0,440,300);

    for(let z=-40;z<playerZ;z+=4) {
        let z2 = z+4;

        // Sol
        polygon([
            [-2.5,0,z], [2.5,0,z], [2.5,0,z2], [-2.5,0,z2]
        ], "#242321");

        // Plafond
        polygon([
            [-2.5,3,z2], [2.5,3,z2], [2.5,3,z], [-2.5,3,z]
        ], "#111110");

        // Murs
        polygon([
            [-2.5,0,z2], [-2.5,3,z2], [-2.5,3,z], [-2.5,0,z]
        ], "#292827");

        polygon([
            [2.5,0,z], [2.5,3,z], [2.5,3,z2], [2.5,0,z2]
        ], "#20201f");

        // Joints
        let line1=project(-2.5,0,z);
        let line2=project(2.5,0,z);
        if(line1 && line2) {
            ctx.strokeStyle="#383634";
            ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(line1.x,line1.y);
            ctx.lineTo(line2.x,line2.y);
            ctx.stroke();
        }

        let a=project(-2.5,0,z);
        let b=project(-2.5,3,z);
        if(a && b) {
            ctx.strokeStyle="#343230";
            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.stroke();
        }
    }

    // Fond
    polygon([
        [-2.5,0,-40], [-2.5,3,-40], [2.5,3,-40], [2.5,0,-40]
    ], "#161616");

    // Affichage du Sang
    drawBloodOverlay();

    // Affichage des Portes Dynamiques
    doors.forEach(d => drawDoor(d));

    // Lampes
    drawLamp(0,2.94,-12);
    drawLamp(0,2.94,-29);

    // Brouillard
    let fog=ctx.createRadialGradient(320,180,70,320,180,350);
    fog.addColorStop(0,"transparent");
    fog.addColorStop(1, doorsOpened >= 10 ? "rgba(40,0,0,0.95)" : "rgba(0,0,0,0.95)");

    ctx.fillStyle=fog;
    ctx.fillRect(0,0,640,360);

    // Grain bruitage
    for(let i=0;i<200;i++) {
        let x=Math.random()*640;
        let y=Math.random()*360;
        ctx.fillStyle=Math.random()>.5 ? "rgba(255,255,255,0.025)" : "rgba(0,0,0,0.08)";
        ctx.fillRect(x,y,2,2);
    }
}

// =================================
// DESSIN DE PORTE
// =================================

function drawDoor(door) {
    let x = door.x;
    let z = door.z;
    let side = door.side;
    let angle = door.openProgress * Math.PI * 0.55;

    // Encadrement / Trou
    polygon([
        [x, 0, z], [x, 2.5, z], [x, 2.5, z - 2], [x, 0, z - 2]
    ], "#000");

    if (door.openProgress > 0.05) {
        let innerX = x + side * 1.5;
        polygon([
            [innerX, 0, z + 1], [innerX, 2.5, z + 1], [innerX, 2.5, z - 3], [innerX, 0, z - 3]
        ], "#181716");
    }

    let dx = Math.sin(angle) * 1.8 * side;
    let dz = -Math.cos(angle) * 1.8;

    let doorBaseX = x;
    let doorBaseZ = z;
    let doorTipX = x - dx;
    let doorTipZ = z + dz;

    polygon([
        [doorBaseX, 0, doorBaseZ],
        [doorBaseX, 2.45, doorBaseZ],
        [doorTipX, 2.45, doorTipZ],
        [doorTipX, 0, doorTipZ]
    ], "#191817");

    let handlePos = project((doorBaseX + doorTipX) / 2, 1, (doorBaseZ + doorTipZ) / 2);
    if(handlePos) {
        ctx.fillStyle="#777";
        ctx.fillRect(handlePos.x-2, handlePos.y-2, 4, 4);
    }
}

function drawLamp(x,y,z) {
    const p=project(x,y,z);
    if(!p) return;
    let s=p.scale;

    ctx.fillStyle="#aaa";
    ctx.fillRect(p.x-s*.3,p.y-s*.1,s*.6,s*.12);

    ctx.fillStyle= doorsOpened >= 10 ? "rgba(255,0,0,0.25)" : "rgba(210,200,170,0.10)";
    ctx.beginPath();
    ctx.ellipse(p.x,p.y+s*.8,s*1.5,s*2,0,0,Math.PI*2);
    ctx.fill();
}

function drawMonster() {
    let z=-30+monster*27;
    let p=project(0,1.5,z);
    if(!p) return;
    let s=p.scale;

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.fillStyle="#020202";

    ctx.beginPath();
    ctx.ellipse(0,0,s*.4,s*1.05,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0,-s*1.1,s*.36,s*.45,0,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#020202";
    ctx.lineWidth=Math.max(2,s*.18);
    ctx.beginPath();
    ctx.moveTo(-s*.3,-s*.3);
    ctx.lineTo(-s*.85,s*1.7);
    ctx.moveTo(s*.3,-s*.3);
    ctx.lineTo(s*.85,s*1.7);
    ctx.stroke();

    ctx.fillStyle="#ff0000";
    ctx.shadowColor="red";
    ctx.shadowBlur=15;
    ctx.beginPath();
    ctx.arc(-s*.13,-s*1.15,Math.max(2,s*.06),0,Math.PI*2);
    ctx.arc(s*.13,-s*1.15,Math.max(2,s*.06),0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawScare() {
    scareTime++;
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,640,360);

    ctx.save();
    let shake=Math.random()*12-6;
    ctx.translate(320+shake,180+shake);

    let s=4+scareTime*.17;
    ctx.scale(s,s);
    ctx.fillStyle="#020202";

    ctx.beginPath();
    ctx.ellipse(0,0,35,55,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="red";
    ctx.shadowColor="red";
    ctx.shadowBlur=30;

    ctx.beginPath();
    ctx.arc(-12,-15,5,0,Math.PI*2);
    ctx.arc(12,-15,5,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    if(scareTime%5===0) {
        ctx.fillStyle="#400";
        ctx.fillRect(0,0,640,360);
    }

    if(scareTime>35) {
        finish();
    }
}

function finish() {
    playing=false;
    scare=false;
    black.style.opacity="1";
    document.exitPointerLock?.();

    setTimeout(()=>{
        second=true;
        menu.innerHTML=`
            <h1>THE CORRIDOR</h1>
            <p>Cette fois, tu peux avancer à l'infini...</p>
            <button id="again">RETOURNER</button>
        `;
        menu.style.display="flex";
        document.getElementById("again").addEventListener("click",start);
    },1300);
}

// =================================
// DÉPLACEMENTS & INTERACTIONS
// =================================

function movement(dt) {
    let speed=2.5*dt;
    let moved = false;

    if(keys["z"] || keys["w"] || keys["arrowup"]) {
        playerX+=Math.sin(yaw)*speed;
        playerZ-=Math.cos(yaw)*speed;
        moved = true;
    }
    if(keys["s"] || keys["arrowdown"]) {
        playerX-=Math.sin(yaw)*speed;
        playerZ+=Math.cos(yaw)*speed;
        moved = true;
    }
    if(keys["q"] || keys["a"]) {
        playerX-=Math.cos(yaw)*speed;
        playerZ-=Math.sin(yaw)*speed;
        moved = true;
    }
    if(keys["d"]) {
        playerX+=Math.cos(yaw)*speed;
        playerZ+=Math.sin(yaw)*speed;
        moved = true;
    }

    if(moved) {
        stepTimer += dt;
        if(stepTimer > 0.45) {
            playSound("step");
            stepTimer = 0;
        }
    }

    if(keys["arrowleft"]) yaw-=1.7*dt;
    if(keys["arrowright"]) yaw+=1.7*dt;

    playerX=Math.max(-1.8,Math.min(1.8,playerX));
    playerZ=Math.max(-37,Math.min(2,playerZ));

    // Détection de proximité des portes
    activeDoor = null;
    doors.forEach((door, index) => {
        let dist = Math.hypot(playerX - door.x, playerZ - (door.z - 1));
        if (dist < 1.8) {
            activeDoor = index;
        }

        if (door.opening && door.openProgress < 1) {
            door.openProgress = Math.min(1, door.openProgress + dt * 2.5);
        }
    });

    if (activeDoor !== null && !doors[activeDoor].opening) {
        promptEl.style.display = "block";
    } else {
        promptEl.style.display = "none";
    }
}

canvas.addEventListener("click",()=>{
    if(playing && second) {
        if (activeDoor !== null && !doors[activeDoor].opening) {
            openDoor(activeDoor);
        } else {
            canvas.requestPointerLock?.();
        }
    }
});

document.addEventListener("mousemove",e=>{
    if(document.pointerLockElement===canvas && playing && second) {
        yaw+=e.movementX*0.002;
    }
});

// =================================
// BOUCLE PRINCIPALE
// =================================

function draw(time=0) {
    let dt=Math.min((time-lastTime)/1000,.05);
    lastTime=time;

    if(!playing) {
        corridor();
        requestAnimationFrame(draw);
        return;
    }

    corridor();

    if(!second && !scare) {
        monster+=dt*.17;
        drawMonster();

        if(monster>=.94) {
            scare=true;
            scareTime=0;
        }
    }

    if(scare) {
        drawScare();
    }

    if(second) {
        movement(dt);
    }

    requestAnimationFrame(draw);
}

draw();

</script>
</body>
</html>
