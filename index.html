
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE CORRIDOR</title>

<style>
* {margin:0;padding:0;box-sizing:border-box}

body {
 background:#000;
 overflow:hidden;
 font-family:Arial;
}

canvas {
 width:100vw;
 height:100vh;
 display:block;
 image-rendering:pixelated;
}

#menu {
 position:absolute;
 inset:0;
 z-index:10;
 background:#050505;
 color:white;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
}

h1 {
 font-size:clamp(35px,7vw,65px);
 letter-spacing:12px;
 text-shadow:0 0 15px red;
}

p {color:#aaa;margin-top:20px}

button {
 background:#300;
 border:1px solid #900;
 color:white;
 padding:16px 45px;
 margin-top:35px;
 font-size:18px;
 cursor:pointer;
}

#black {
 position:absolute;
 inset:0;
 background:black;
 opacity:0;
 pointer-events:none;
 z-index:5;
}

#help {
 position:absolute;
 bottom:20px;
 left:20px;
 color:white;
 font-size:13px;
}
</style>
</head>

<body>

<div id="menu">
 <h1>THE CORRIDOR</h1>
 <p>Tu es seul...</p>
 <button id="enter">ENTRER</button>
</div>

<div id="black"></div>
<div id="help"></div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=640;
canvas.height=360;

let playing=false;
let second=false;
let monster=0;
let playerX=0;
let playerY=0;
let keys={};
let scare=false;
let scareTime=0;

const menu=document.getElementById("menu");
const black=document.getElementById("black");

document.getElementById("enter").addEventListener("click",start);

function start(){

 playing=true;
 scare=false;
 scareTime=0;
 monster=0;
 playerX=0;
 playerY=0;

 black.style.opacity=0;
 menu.style.display="none";

 document.getElementById("help").innerText=
 second ? "ZQSD / FLÈCHES : BOUGER" : "";

}

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function corridor(){

 ctx.fillStyle="#030303";
 ctx.fillRect(0,0,640,360);

 // plafond
 ctx.fillStyle="#101010";
 ctx.beginPath();
 ctx.moveTo(0,0);
 ctx.lineTo(640,0);
 ctx.lineTo(430,125);
 ctx.lineTo(210,125);
 ctx.fill();

 // mur gauche
 ctx.fillStyle="#181818";
 ctx.beginPath();
 ctx.moveTo(0,0);
 ctx.lineTo(210,125);
 ctx.lineTo(210,360);
 ctx.lineTo(0,360);
 ctx.fill();

 // mur droit
 ctx.fillStyle="#151515";
 ctx.beginPath();
 ctx.moveTo(640,0);
 ctx.lineTo(430,125);
 ctx.lineTo(430,360);
 ctx.lineTo(640,360);
 ctx.fill();

 // sol
 ctx.fillStyle="#242424";
 ctx.beginPath();
 ctx.moveTo(0,360);
 ctx.lineTo(210,125);
 ctx.lineTo(430,125);
 ctx.lineTo(640,360);
 ctx.fill();

 // porte du fond
 ctx.fillStyle="#050505";
 ctx.fillRect(250,125,140,110);

 // lumière
 let glow=ctx.createRadialGradient(320,150,5,320,150,150);
 glow.addColorStop(0,"#555");
 glow.addColorStop(1,"transparent");
 ctx.fillStyle=glow;
 ctx.fillRect(150,40,340,250);

 // vignette
 let v=ctx.createRadialGradient(320,180,50,320,180,330);
 v.addColorStop(0,"transparent");
 v.addColorStop(1,"black");
 ctx.fillStyle=v;
 ctx.fillRect(0,0,640,360);
}

function drawMonster(){

 let size=18+monster*65;
 let x=320-playerX*35;
 let y=180+monster*75;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(size/35,size/35);

 // corps
 ctx.fillStyle="#020202";
 ctx.beginPath();
 ctx.ellipse(0,25,19,48,0,0,Math.PI*2);
 ctx.fill();

 // tête
 ctx.beginPath();
 ctx.ellipse(0,-32,19,24,0,0,Math.PI*2);
 ctx.fill();

 // bras longs
 ctx.strokeStyle="#020202";
 ctx.lineWidth=9;
 ctx.beginPath();
 ctx.moveTo(-15,0);
 ctx.lineTo(-34,65);
 ctx.moveTo(15,0);
 ctx.lineTo(34,65);
 ctx.stroke();

 // yeux rouges
 ctx.fillStyle="#ff0000";
 ctx.shadowColor="red";
 ctx.shadowBlur=15;
 ctx.beginPath();
 ctx.arc(-7,-34,3,0,Math.PI*2);
 ctx.arc(7,-34,3,0,Math.PI*2);
 ctx.fill();

 // bouche
 ctx.shadowBlur=0;
 ctx.fillStyle="#000";
 ctx.fillRect(-7,-18,14,13);

 ctx.restore();
}

function draw(){

 corridor();

 if(playing){

  if(!second && !scare){
   monster+=0.0035;

   drawMonster();

   if(monster>0.85){
    scare=true;
    scareTime=0;
   }
  }

  if(second){

   if(keys["z"]||keys["arrowup"]) playerY-=2;
   if(keys["s"]||keys["arrowdown"]) playerY+=2;
   if(keys["q"]||keys["arrowleft"]) playerX-=2;
   if(keys["d"]||keys["arrowright"]) playerX+=2;

   playerX=Math.max(-2,Math.min(2,playerX));
   playerY=Math.max(-40,Math.min(40,playerY));

   ctx.fillStyle="#080808";
   ctx.fillRect(0,0,640,360);
   corridor();

  }

  if(scare){

   scareTime++;

   ctx.fillStyle="#000";
   ctx.fillRect(0,0,640,360);

   ctx.save();
   ctx.translate(320,180);
   ctx.scale(4+scareTime*.15,4+scareTime*.15);

   ctx.fillStyle="#020202";
   ctx.beginPath();
   ctx.ellipse(0,0,35,55,0,0,Math.PI*2);
   ctx.fill();

   ctx.fillStyle="red";
   ctx.shadowColor="red";
   ctx.shadowBlur=25;
   ctx.beginPath();
   ctx.arc(-12,-15,5,0,Math.PI*2);
   ctx.arc(12,-15,5,0,Math.PI*2);
   ctx.fill();

   ctx.restore();

   if(scareTime%5===0){
    ctx.fillStyle="#400";
    ctx.fillRect(0,0,640,360);
   }

   if(scareTime>35){
    finish();
   }
  }

 }

 requestAnimationFrame(draw);
}

function finish(){

 playing=false;
 scare=false;

 black.style.opacity=1;

 setTimeout(()=>{
  second=true;
  menu.innerHTML=`
   <h1>THE CORRIDOR</h1>
   <p>Tu pensais que c'était fini ?</p>
   <button id="again">RETOURNER</button>
  `;
  menu.style.display="flex";

  document.getElementById("again")
  .addEventListener("click",start);

 },1200);
}

draw();

</script>
</body>
</html>
